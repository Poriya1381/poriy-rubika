services:
  - type: web
    name: rubika-shop-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: VARIZA_API_KEY
        sync: false
      - key: VARIZA_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_FRONTEND
        sync: false
      - key: VARIZA_RETURN_URL
        sync: false
